<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINGO - Controle de Visitas</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --warning: #ca8a04;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            padding-bottom: 80px;
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 12px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            box-sizing: border-box;
        }

        .month-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            background: #e2e8f0;
            padding: 8px;
            border-radius: 8px;
        }

        .month-selector select {
            padding: 6px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            background: white;
            color: var(--text);
        }

        /* Seletor de Rua */
        .street-selector-container {
            margin-bottom: 14px;
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .street-selector-container label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #475569;
        }

        .street-selector-row {
            display: flex;
            gap: 8px;
        }

        .street-selector-row select {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            background: white;
            color: var(--text);
        }

        /* Barra de Ações Principais (Relatório e Excluir Rua Lado a Lado) */
        .action-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        button {
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 10px 12px;
        }
        button:active {
            opacity: 0.8;
        }

        .btn-report {
            background: #0f172a;
            color: white;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-delete-street {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #475569;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-delete-street:hover {
            background: #e2e8f0;
            color: var(--danger);
            border-color: #fca5a5;
        }

        /* Botão Flutuante (FAB) */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--primary);
            color: white;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            z-index: 99;
            border: none;
            transition: transform 0.2s ease;
        }
        .fab:hover {
            transform: scale(1.05);
        }

        /* Menu de Opções Flutuantes */
        .fab-menu {
            display: none;
            position: fixed;
            bottom: 90px;
            right: 24px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            padding: 8px;
            z-index: 99;
            flex-direction: column;
            gap: 4px;
            min-width: 200px;
            border: 1px solid #e2e8f0;
            animation: fadeIn 0.2s ease;
        }

        .fab-menu-item {
            background: none;
            border: none;
            text-align: left;
            padding: 10px 12px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fab-menu-item:hover {
            background: #f1f5f9;
            color: var(--primary);
        }

        /* Painel Retrátil para Adicionar Casas na Rua Atual */
        .houses-panel {
            display: none;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            box-sizing: border-box;
            animation: fadeIn 0.2s ease;
        }

        .houses-panel h3 {
            font-size: 0.85rem;
            margin: 0 0 8px 0;
            color: #334155;
        }

        .panel-group {
            display: flex;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .panel-group input {
            flex: 1;
            min-width: 0;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .panel-group button.btn-plus-house {
            background: var(--primary);
            color: white;
            border: none;
            width: 42px;
            height: 38px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Grid de Casas */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px;
            margin-bottom: 16px;
        }

        .house-box {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            height: 65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: all 0.1s ease;
        }

        .house-box.visited {
            background: var(--success);
            border-color: #15803d;
            color: white;
        }

        .house-box.absent {
            background: var(--warning);
            border-color: #a16207;
            color: white;
        }

        .delete-house {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            border: none;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .delete-house:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        /* Legenda */
        .legend {
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 16px;
            justify-content: center;
            align-items: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* Histórico em Sanfona (Acordeon) */
        .accordion {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 16px;
        }

        .accordion-header {
            padding: 10px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #475569;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            user-select: none;
        }

        .accordion-body {
            display: none;
            padding: 10px;
            background: white;
            max-height: 200px;
            overflow-y: auto;
            flex-direction: column;
            gap: 6px;
            font-size: 0.8rem;
        }

        .history-item {
            background: #f8fafc;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-tag {
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .tag-visited { background: #dcfce7; color: #166534; }
        .tag-absent { background: #fef9c3; color: #854d0e; }
        .tag-pending { background: #f1f5f9; color: #475569; }

        .date-input {
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 0.75rem;
            font-family: inherit;
            color: #475569;
            background: #fff;
            cursor: pointer;
        }

        /* Modais Gerais */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
            box-sizing: border-box;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            max-height: 90vh;
            box-sizing: border-box;
            box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .modal-header h2 {
            font-size: 1rem;
            margin: 0;
            color: var(--text);
        }

        .modal-body {
            overflow-y: auto;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            line-height: 1.3;
            padding: 4px;
        }

        .report-section-title {
            font-weight: bold;
            color: #334155;
            margin-bottom: 6px;
            font-size: 0.85rem;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 2px;
        }

        .report-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .report-box {
            border-radius: 6px;
            padding: 4px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            min-width: 50px;
            border: 1px solid rgba(0,0,0,0.15);
        }
        .report-box.box-visited { background: #dcfce7 !important; color: #166534 !important; border-color: #bbf7d0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .report-box.box-absent { background: #fef9c3 !important; color: #854d0e !important; border-color: #fef08a !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .report-box.box-pending { background: #f1f5f9 !important; color: #475569 !important; border-color: #cbd5e1 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

        .report-box-date {
            font-size: 0.6rem;
            font-weight: normal;
            margin-top: 1px;
            opacity: 0.9;
        }

        .modal-footer {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .modal-footer button {
            flex: 1;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 30px;
            font-size: 0.9rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Regras exclusivas para impressão limpa em PDF / Papel */
        @media print {
            body * {
                visibility: hidden;
            }
            #pdfArea, #pdfArea * {
                visibility: visible;
            }
            #pdfArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 0;
            }
            .modal {
                display: block !important;
                position: absolute;
                background: white !important;
            }
            .modal-content {
                box-shadow: none !important;
                max-width: 100% !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BINGO - Controle de Visitas</h1>

    <!-- Seletor de Mês -->
    <div class="month-selector">
        <label for="monthSelect" style="font-size: 0.85rem; font-weight: bold; color: #475569;">Mês:</label>
        <select id="monthSelect" onchange="switchMonth(this.value)"></select>
    </div>

    <!-- Seletor de Rua -->
    <div class="street-selector-container">
        <label for="streetSelect">Rua Selecionada:</label>
        <div class="street-selector-row">
            <select id="streetSelect" onchange="switchStreet(this.value)"></select>
        </div>
    </div>

    <!-- Painel Retrátil para Adicionar Mais Casas na Rua Atual -->
    <div id="housesPanel" class="houses-panel">
        <h3>🏠 Adicionar casas na rua atual</h3>
        <div class="panel-group">
            <input type="text" id="houseNumberInput" placeholder="Números (ex: 10, 12, 14 ou 22A)" onkeydown="if(event.key==='Enter') addHouses()">
            <button type="button" class="btn-plus-house" onclick="addHouses()" title="Adicionar">+</button>
        </div>
    </div>

    <div id="streetContent">
        <!-- Barra de Ações Principais (Relatório e Excluir Rua Lado a Lado) -->
        <div class="action-bar">
            <button type="button" class="btn-report" onclick="openReport()">📄 Relatório Visual</button>
            <button type="button" class="btn-delete-street" onclick="deleteCurrentStreet()">🗑️ Excluir Rua</button>
        </div>

        <!-- Grid de Casas -->
        <div id="housesGrid" class="grid"></div>

        <div class="legend">
            <div class="legend-item"><div class="color-dot" style="background: #cbd5e1;"></div>Pendente</div>
            <div class="legend-item"><div class="color-dot" style="background: var(--success);"></div>Visitada</div>
            <div class="legend-item"><div class="color-dot" style="background: var(--warning);"></div>Ausente</div>
        </div>

        <!-- Histórico em Sanfona (Acordeon) -->
        <div class="accordion">
            <div class="accordion-header" onclick="toggleAccordion()">
                <span>📋 Histórico de Ações do Mês</span>
                <span id="accordionIcon">▼</span>
            </div>
            <div id="accordionBody" class="accordion-body">
                <div style="color: #94a3b8; text-align: center; padding: 8px;">Nenhuma ação registrada neste mês.</div>
            </div>
        </div>
    </div>
</div>

<!-- Botão Flutuante (FAB) e Menu de Opções -->
<button type="button" class="fab" onclick="toggleFabMenu()" title="Cadastros">+</button>
<div id="fabMenu" class="fab-menu">
    <button type="button" class="fab-menu-item" onclick="openNewStreetModal()">➕ Cadastrar Nova Rua</button>
    <button type="button" class="fab-menu-item" onclick="toggleHousesPanel()">🏠 Adicionar Casas na Rua</button>
</div>

<!-- Modal: Cadastrar Nova Rua -->
<div id="newStreetModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Cadastrar Nova Rua</h2>
            <button type="button" class="btn-delete-street" onclick="closeNewStreetModal()" style="width: auto; padding: 2px 8px; font-size: 1.2rem; margin:0; flex:none;">×</button>
        </div>
        <div class="modal-body">
            <label style="font-size: 0.8rem; font-weight: bold; color: #475569;">Nome da Rua:</label>
            <input type="text" id="modalStreetNameInput" placeholder="Ex: Rua das Flores" onkeydown="if(event.key==='Enter') addNewStreetFromModal()" style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; width: 100%; box-sizing: border-box;">
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-report" onclick="addNewStreetFromModal()">Criar Rua</button>
            <button type="button" class="btn-delete-street" onclick="closeNewStreetModal()">Cancelar</button>
        </div>
    </div>
</div>

<!-- Modal de Relatório -->
<div id="reportModal" class="modal">
    <div class="modal-content" style="max-width: 550px;">
        <div class="modal-header">
            <h2 id="reportModalTitle">Relatório Visual da Rua</h2>
            <button type="button" class="btn-delete-street" onclick="closeReport()" style="width: auto; padding: 2px 8px; font-size: 1.2rem; margin:0; flex:none;">×</button>
        </div>
        
        <div class="modal-body" id="pdfArea" style="background: #ffffff; padding: 8px;">
            <div style="font-size: 1.1rem; font-weight: bold; color: #1e293b; margin-bottom: 2px;" id="pdfStreetName">Rua</div>
            <div style="font-size: 0.85rem; color: #64748b; margin-bottom: 14px;" id="pdfMonthSubtitle">Mês: </div>

            <div style="margin-bottom: 10px;">
                <div class="report-section-title">✅ Casas Visitadas</div>
                <div id="reportVisitedGrid" class="report-grid"></div>
            </div>

            <div style="margin-bottom: 10px;">
                <div class="report-section-title">⚠️ Casas Ausentes</div>
                <div id="reportAbsentGrid" class="report-grid"></div>
            </div>

            <div style="margin-bottom: 10px;">
                <div class="report-section-title">⏳ Casas Pendentes</div>
                <div id="reportPendingGrid" class="report-grid"></div>
            </div>
        </div>

        <div class="modal-footer">
            <button type="button" class="btn-report" onclick="window.print()">🖨️ Salvar como PDF / Imprimir</button>
            <button type="button" class="btn-delete-street" onclick="closeReport()">Fechar</button>
        </div>
    </div>
</div>

<script>
    let db = {};
    try {
        db = JSON.parse(localStorage.getItem('health_visits_master_v23')) || {};
    } catch(e) {
        db = {};
    }

    const now = new Date();
    const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    
    let activeMonth = currentYearMonth;
    let activeStreet = null;

    if (!db[activeMonth]) {
        db[activeMonth] = { ruas: {} };
    }

    function getOrCreateMonth(monthKey) {
        if (!db[monthKey]) {
            db[monthKey] = { ruas: {} };
            const allMonths = Object.keys(db).sort();
            if (allMonths.length > 1) {
                const prevMonth = allMonths[allMonths.indexOf(monthKey) - 1];
                if (prevMonth && db[prevMonth] && db[prevMonth].ruas) {
                    Object.keys(db[prevMonth].ruas).forEach(streetName => {
                        db[monthKey].ruas[streetName] = { houses: {}, history: [] };
                        Object.keys(db[prevMonth].ruas[streetName].houses).forEach(houseNum => {
                            db[monthKey].ruas[streetName].houses[houseNum] = { status: 0, date: null };
                        });
                    });
                }
            }
        }
        return db[monthKey];
    }

    function saveData() {
        try {
            localStorage.setItem('health_visits_master_v23', JSON.stringify(db));
        } catch(e) {}
        render();
    }

    // Controles do Botão Flutuante
    function toggleFabMenu() {
        const menu = document.getElementById('fabMenu');
        if (menu) {
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }
    }

    // Fecha o menu flutuante ao clicar fora
    window.onclick = function(event) {
        if (!event.target.matches('.fab') && !event.target.closest('.fab-menu')) {
            const menu = document.getElementById('fabMenu');
            if (menu) menu.style.display = 'none';
        }
    }

    // Modal de Nova Rua
    function openNewStreetModal() {
        toggleFabMenu();
        const modal = document.getElementById('newStreetModal');
        if (modal) {
            modal.style.display = 'flex';
            setTimeout(() => {
                document.getElementById('modalStreetNameInput').focus();
            }, 100);
        }
    }

    function closeNewStreetModal() {
        const modal = document.getElementById('newStreetModal');
        if (modal) {
            modal.style.display = 'none';
            document.getElementById('modalStreetNameInput').value = '';
        }
    }

    function addNewStreetFromModal() {
        const input = document.getElementById('modalStreetNameInput');
        if (!input) return;
        const name = input.value.trim();
        if (!name) return;

        let monthData = getOrCreateMonth(activeMonth);
        if (!monthData.ruas[name]) {
            monthData.ruas[name] = { houses: {}, history: [] };
        }
        activeStreet = name;
        closeNewStreetModal();
        saveData();

        // Abre automaticamente o painel de casas para facilitar a inclusão dos números na rua recém-criada
        const panel = document.getElementById('housesPanel');
        if (panel) {
            panel.style.display = 'block';
            setTimeout(() => {
                document.getElementById('houseNumberInput').focus();
            }, 100);
        }
    }

    // Painel Retrátil de Adicionar Casas na Rua Atual
    function toggleHousesPanel() {
        toggleFabMenu();
        const panel = document.getElementById('housesPanel');
        if (panel) {
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
            if (panel.style.display === 'block') {
                setTimeout(() => {
                    document.getElementById('houseNumberInput').focus();
                }, 100);
            }
        }
    }

    function toggleAccordion() {
        const body = document.getElementById('accordionBody');
        const icon = document.getElementById('accordionIcon');
        if (body && icon) {
            if (body.style.display === 'flex') {
                body.style.display = 'none';
                icon.innerText = '▼';
            } else {
                body.style.display = 'flex';
                icon.innerText = '▲';
            }
        }
    }

    function switchMonth(newMonth) {
        activeMonth = newMonth;
        let monthData = getOrCreateMonth(activeMonth);
        const streetKeys = Object.keys(monthData.ruas);
        activeStreet = streetKeys.length > 0 ? streetKeys[0] : null;
        render();
    }

    function deleteCurrentStreet() {
        if (!activeStreet) return;
        if (confirm(`Deseja realmente excluir a rua "${activeStreet}" neste mês?`)) {
            let monthData = getOrCreateMonth(activeMonth);
            delete monthData.ruas[activeStreet];
            const remaining = Object.keys(monthData.ruas);
            activeStreet = remaining.length > 0 ? remaining[0] : null;
            saveData();
        }
    }

    function switchStreet(name) {
        activeStreet = name;
        render();
    }

    function addHouses() {
        if (!activeStreet) return;
        const input = document.getElementById('houseNumberInput');
        if (!input) return;
        const val = input.value.trim();
        if (!val) return;

        const numbers = val.split(',').map(n => n.trim()).filter(n => n !== '');
        let monthData = getOrCreateMonth(activeMonth);
        
        numbers.forEach(num => {
            if (!(num in monthData.ruas[activeStreet].houses)) {
                monthData.ruas[activeStreet].houses[num] = { status: 0, date: null };
            }
        });

        input.value = '';
        const panel = document.getElementById('housesPanel');
        if (panel) panel.style.display = 'none'; // Fecha o painel após adicionar
        saveData();
    }

    function cycleHouseStatus(num, event) {
        if (event && event.target && (event.target.classList.contains('delete-house') || event.target.closest('.delete-house'))) return;
        if (!activeStreet) return;

        let monthData = getOrCreateMonth(activeMonth);
        let house = monthData.ruas[activeStreet].houses[num];
        if (!house) return;
        
        let nextStatus = (house.status + 1) % 3; 
        
        let nowObj = new Date();
        let year = nowObj.getFullYear();
        let month = String(nowObj.getMonth() + 1).padStart(2, '0');
        let day = String(nowObj.getDate()).padStart(2, '0');
        let dateStr = `${day}/${month}/${year}`;

        house.status = nextStatus;
        house.date = (nextStatus !== 0) ? (house.date || dateStr) : null;

        let statusText = 'Pendente';
        let tagClass = 'tag-pending';
        if (nextStatus === 1) { statusText = 'Visitada'; tagClass = 'tag-visited'; }
        if (nextStatus === 2) { statusText = 'Ausente'; tagClass = 'tag-absent'; }

        if (!monthData.ruas[activeStreet].history) {
            monthData.ruas[activeStreet].history = [];
        }

        let history = monthData.ruas[activeStreet].history;
        let existingIndex = history.findIndex(item => item.house === num);

        if (nextStatus === 0) {
            if (existingIndex !== -1) {
                history.splice(existingIndex, 1);
            }
        } else {
            if (existingIndex !== -1) {
                history[existingIndex].statusText = statusText;
                history[existingIndex].tagClass = tagClass;
            } else {
                history.unshift({
                    house: num,
                    statusText: statusText,
                    tagClass: tagClass,
                    date: house.date
                });
            }
        }

        saveData();
    }

    function updateHistoryDate(houseNum, newDate) {
        if (!activeStreet) return;
        
        let monthData = getOrCreateMonth(activeMonth);
        let streetData = monthData.ruas[activeStreet];
        if (!streetData) return;

        let formattedDate = newDate;
        if (newDate && newDate.includes('-')) {
            let parts = newDate.split('-');
            if (parts.length === 3) {
                formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
        }

        if (streetData.history) {
            let histItem = streetData.history.find(item => item.house === houseNum);
            if (histItem) {
                histItem.date = formattedDate;
            }
        }

        if (streetData.houses && streetData.houses[houseNum]) {
            streetData.houses[houseNum].date = formattedDate;
        }

        saveData();
    }

    function deleteHouse(num, event) {
        if (event) event.stopPropagation();
        if (!activeStreet) return;
        if (confirm(`Remover a casa ${num}?`)) {
            let monthData = getOrCreateMonth(activeMonth);
            if (monthData.ruas[activeStreet].houses) {
                delete monthData.ruas[activeStreet].houses[num];
            }
            if (monthData.ruas[activeStreet].history) {
                monthData.ruas[activeStreet].history = monthData.ruas[activeStreet].history.filter(item => item.house !== num);
            }
            saveData();
        }
    }

    function openReport() {
        if (!activeStreet) return;
        let monthData = getOrCreateMonth(activeMonth);
        const streetData = monthData.ruas[activeStreet];
        const modal = document.getElementById('reportModal');
        const pdfStreetName = document.getElementById('pdfStreetName');
        const pdfMonthSubtitle = document.getElementById('pdfMonthSubtitle');
        const visitedGrid = document.getElementById('reportVisitedGrid');
        const absentGrid = document.getElementById('reportAbsentGrid');
        const pendingGrid = document.getElementById('reportPendingGrid');
        
        if (!modal) return;

        pdfStreetName.innerText = `Rua: ${activeStreet}`;
        pdfMonthSubtitle.innerText = `Referência: ${formatMonthName(activeMonth)}`;

        let visited = [];
        let absent = [];
        let pending = [];

        if (streetData.houses) {
            Object.keys(streetData.houses).forEach(num => {
                let h = streetData.houses[num];
                if (h && h.status === 1) {
                    visited.push({ num, date: h.date || 'S/ Data' });
                } else if (h && h.status === 2) {
                    absent.push({ num, date: h.date || 'S/ Data' });
                } else {
                    pending.push(num);
                }
            });
        }

        visitedGrid.innerHTML = visited.length === 0 ? '<div style="font-size:0.75rem; color:#64748b;">Nenhuma</div>' : '';
        visited.forEach(v => {
            let box = document.createElement('div');
            box.className = 'report-box box-visited';
            box.innerHTML = `<span>${v.num}</span><span class="report-box-date">${v.date}</span>`;
            visitedGrid.appendChild(box);
        });

        absentGrid.innerHTML = absent.length === 0 ? '<div style="font-size:0.75rem; color:#64748b;">Nenhuma</div>' : '';
        absent.forEach(a => {
            let box = document.createElement('div');
            box.className = 'report-box box-absent';
            box.innerHTML = `<span>${a.num}</span><span class="report-box-date">${a.date}</span>`;
            absentGrid.appendChild(box);
        });

        pendingGrid.innerHTML = pending.length === 0 ? '<div style="font-size:0.75rem; color:#16a34a; font-weight:bold;">Todas visitadas!</div>' : '';
        pending.forEach(p => {
            let box = document.createElement('div');
            box.className = 'report-box box-pending';
            box.innerHTML = `<span>${p}</span>`;
            pendingGrid.appendChild(box);
        });

        modal.style.display = 'flex';
    }

    function closeReport() {
        const modal = document.getElementById('reportModal');
        if (modal) modal.style.display = 'none';
    }

    function formatMonthName(yearMonthStr) {
        const parts = yearMonthStr.split('-');
        if (parts.length !== 2) return yearMonthStr;
        const year = parts[0];
        const monthNum = parseInt(parts[1], 10);
        const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        return `${months[monthNum - 1]} de ${year}`;
    }

    function render() {
        const monthSelect = document.getElementById('monthSelect');
        const streetSelect = document.getElementById('streetSelect');
        const housesGrid = document.getElementById('housesGrid');
        const streetContent = document.getElementById('streetContent');
        const accordionBody = document.getElementById('accordionBody');

        if (!monthSelect || !streetSelect || !housesGrid || !streetContent || !accordionBody) return;

        let allMonths = Object.keys(db);
        if (!allMonths.includes(currentYearMonth)) {
            allMonths.push(currentYearMonth);
        }
        allMonths.sort().reverse();

        monthSelect.innerHTML = '';
        allMonths.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.innerText = formatMonthName(m);
            if (m === activeMonth) opt.selected = true;
            monthSelect.appendChild(opt);
        });

        let monthData = getOrCreateMonth(activeMonth);
        const streets = Object.keys(monthData.ruas);

        if (streets.length === 0) {
            streetContent.style.display = 'none';
            streetSelect.innerHTML = '<option value="">Nenhuma rua cadastrada</option>';
            return;
        }

        streetContent.style.display = 'block';

        if (!activeStreet || !monthData.ruas[activeStreet]) {
            activeStreet = streets[0];
        }

        streetSelect.innerHTML = '';
        streets.forEach(street => {
            const opt = document.createElement('option');
            opt.value = street;
            opt.innerText = street;
            if (street === activeStreet) opt.selected = true;
            streetSelect.appendChild(opt);
        });

        housesGrid.innerHTML = '';
        const streetData = monthData.ruas[activeStreet];
        const houseKeys = streetData && streetData.houses ? Object.keys(streetData.houses) : [];

        if (houseKeys.length === 0) {
            housesGrid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">Nenhuma casa cadastrada nesta rua.<br>Toque no botão <strong>+</strong> no canto inferior direito para adicionar casas.</div>';
        } else {
            houseKeys.forEach(num => {
                const house = streetData.houses[num];
                const div = document.createElement('div');
                
                let statusClass = '';
                if (house && house.status === 1) statusClass = 'visited';
                if (house && house.status === 2) statusClass = 'absent';

                div.className = `house-box ${statusClass}`;
                div.innerHTML = `
                    <span>${num}</span>
                    <button type="button" class="delete-house" onclick="deleteHouse('${num}', event)" title="Excluir casa">×</button>
                `;
                div.onclick = (e) => cycleHouseStatus(num, e);
                housesGrid.appendChild(div);
            });
        }

        accordionBody.innerHTML = '';
        if (!streetData.history || streetData.history.length === 0) {
            accordionBody.innerHTML = '<div style="color: #94a3b8; text-align: center; padding: 6px;">Nenhuma ação registrada neste mês.</div>';
        } else {
            streetData.history.forEach((item) => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                
                let dateVal = '';
                if (item.date && item.date.includes('/')) {
                    let parts = item.date.split('/');
                    if (parts.length === 3) {
                        dateVal = `${parts[2]}-${parts[1]}-${parts[0]}`;
                    }
                }

                historyItem.innerHTML = `
                    <span>Casa <strong>${item.house}</strong> marcada como <span class="history-tag ${item.tagClass}">${item.statusText}</span></span>
                    <input type="date" class="date-input" value="${dateVal}" onchange="updateHistoryDate('${item.house}', this.value)">
                `;
                accordionBody.appendChild(historyItem);
            });
        }
    }

    window.onload = function() {
        getOrCreateMonth(activeMonth);
        render();
    };
</script>

</body>
