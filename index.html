<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINGO- Controle de Visitas</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --warning: #ca8a04;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 8px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        /* Seletor de Mês no Topo */
        .month-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            background: #e2e8f0;
            padding: 8px;
            border-radius: 8px;
        }

        .month-selector select {
            padding: 6px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            background: white;
            color: var(--text);
        }

        .street-manager {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .street-manager input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        button:active {
            opacity: 0.8;
        }

        /* Seletor de Ruas em formato Dropdown amigável para celular */
        .street-selector-container {
            margin-bottom: 16px;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .street-selector-container label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #475569;
        }

        .street-selector-row {
            display: flex;
            gap: 8px;
        }

        .street-selector-row select {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            background: white;
            color: var(--text);
        }

        .street-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .street-title-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .street-header span {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .street-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-report {
            background: #0f172a;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-delete-street {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-delete-street:hover {
            color: var(--danger);
            background: rgba(220, 38, 38, 0.1);
        }

        .number-adder {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .number-adder input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px;
            margin-bottom: 16px;
        }

        .house-box {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: all 0.1s ease;
        }

        .house-box.visited {
            background: var(--success);
            border-color: #15803d;
            color: white;
        }

        .house-box.absent {
            background: var(--warning);
            border-color: #a16207;
            color: white;
        }

        .delete-house {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            border: none;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .delete-house:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        .legend {
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 16px;
            justify-content: center;
            align-items: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .history-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
        }

        .history-section h3 {
            font-size: 0.9rem;
            margin: 0 0 8px 0;
            color: #475569;
        }

        .history-list {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.8rem;
        }

        .history-item {
            background: white;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-tag {
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .tag-visited { background: #dcfce7; color: #166534; }
        .tag-absent { background: #fef9c3; color: #854d0e; }
        .tag-pending { background: #f1f5f9; color: #475569; }

        .date-input {
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 0.75rem;
            font-family: inherit;
            color: #475569;
            background: #f8fafc;
            cursor: pointer;
        }

        /* Modal de Relatório Visual */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
            box-sizing: border-box;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 550px;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            max-height: 90vh;
            box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .modal-header h2 {
            font-size: 1rem;
            margin: 0;
            color: var(--text);
        }

        .modal-body {
            overflow-y: auto;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 16px;
            line-height: 1.4;
            padding: 4px;
        }

        .report-section-title {
            font-weight: bold;
            color: #334155;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 6px;
        }

        .report-box {
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            min-height: 45px;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .report-box.box-visited { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
        .report-box.box-absent { background: #fef9c3; color: #854d0e; border-color: #fef08a; }
        .report-box.box-pending { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }

        .report-box-date {
            font-size: 0.65rem;
            font-weight: normal;
            margin-top: 2px;
            opacity: 0.85;
        }

        .modal-footer {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .modal-footer button {
            flex: 1;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 24px;
            font-size: 0.9rem;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="container">
    <h1>Controle de Visitas - Saúde</h1>

    <!-- Seletor de Mês -->
    <div class="month-selector">
        <label for="monthSelect" style="font-size: 0.85rem; font-weight: bold; color: #475569;">Mês de Referência:</label>
        <select id="monthSelect" onchange="switchMonth(this.value)"></select>
    </div>

    <!-- Adicionar Nova Rua -->
    <div class="street-manager">
        <input type="text" id="streetNameInput" placeholder="Nome da Rua (ex: Rua das Flores)">
        <button type="button" onclick="addStreet()">+ Rua</button>
    </div>

    <!-- Seletor de Ruas em Menu Suspenso (Dropdown) para celular -->
    <div class="street-selector-container">
        <label for="streetSelect">Selecione a Rua:</label>
        <div class="street-selector-row">
            <select id="streetSelect" onchange="switchStreet(this.value)"></select>
        </div>
    </div>

    <div id="streetContent">
        <div class="street-header">
            <div class="street-title-area">
                <span id="currentStreetTitle">Rua</span>
            </div>
            <div class="street-actions">
                <button type="button" class="btn-report" onclick="openReport()">📄 Relatório Visual</button>
                <button type="button" class="btn-delete-street" onclick="deleteCurrentStreet()" title="Excluir Rua">🗑️</button>
            </div>
        </div>

        <div class="number-adder">
            <input type="text" id="houseNumberInput" placeholder="Números (ex: 10, 12, 14 ou 22A)">
            <button type="button" onclick="addHouses()">Adicionar Casa(s)</button>
        </div>

        <div id="housesGrid" class="grid"></div>

        <div class="legend">
            <div class="legend-item"><div class="color-dot" style="background: #cbd5e1;"></div>Pendente</div>
            <div class="legend-item"><div class="color-dot" style="background: var(--success);"></div>Visitada</div>
            <div class="legend-item"><div class="color-dot" style="background: var(--warning);"></div>Ausente</div>
        </div>

        <div class="history-section">
            <h3>Histórico de Ações (Mês Atual)</h3>
            <div id="historyList" class="history-list">
                <div style="color: #94a3b8; text-align: center; padding: 8px;">Nenhuma ação registrada neste mês.</div>
            </div>
        </div>
    </div>
</div>

<!-- Modal de Relatório Visual -->
<div id="reportModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="reportModalTitle">Relatório Visual da Rua</h2>
            <button type="button" class="btn-delete-street" onclick="closeReport()" style="font-size: 1.2rem;">×</button>
        </div>
        
        <div class="modal-body" id="pdfArea">
            <div style="font-size: 0.9rem; font-weight: bold; color: #1e293b; margin-bottom: 2px;" id="pdfStreetName">Rua</div>
            <div style="font-size: 0.75rem; color: #64748b; margin-bottom: 12px;" id="pdfMonthSubtitle">Mês: </div>

            <div>
                <div class="report-section-title">✅ Casas Visitadas</div>
                <div id="reportVisitedGrid" class="report-grid"></div>
            </div>

            <div style="margin-top: 8px;">
                <div class="report-section-title">⚠️ Casas Ausentes</div>
                <div id="reportAbsentGrid" class="report-grid"></div>
            </div>

            <div style="margin-top: 8px;">
                <div class="report-section-title">⏳ Casas Pendentes</div>
                <div id="reportPendingGrid" class="report-grid"></div>
            </div>
        </div>

        <div class="modal-footer">
            <button type="button" onclick="downloadPDF()">Baixar PDF</button>
            <button type="button" style="background: #64748b;" onclick="closeReport()">Fechar</button>
        </div>
    </div>
</div>

<script>
    let db = {};
    try {
        db = JSON.parse(localStorage.getItem('health_visits_master_v11')) || {};
    } catch(e) {
        db = {};
    }

    const now = new Date();
    const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    
    let activeMonth = currentYearMonth;
    let activeStreet = null;

    if (!db[activeMonth]) {
        db[activeMonth] = { ruas: {} };
    }

    function getOrCreateMonth(monthKey) {
        if (!db[monthKey]) {
            db[monthKey] = { ruas: {} };
            const allMonths = Object.keys(db).sort();
            if (allMonths.length > 1) {
                const prevMonth = allMonths[allMonths.indexOf(monthKey) - 1];
                if (prevMonth && db[prevMonth] && db[prevMonth].ruas) {
                    Object.keys(db[prevMonth].ruas).forEach(streetName => {
                        db[monthKey].ruas[streetName] = { houses: {}, history: [] };
                        Object.keys(db[prevMonth].ruas[streetName].houses).forEach(houseNum => {
                            db[monthKey].ruas[streetName].houses[houseNum] = { status: 0, date: null };
                        });
                    });
                }
            }
        }
        return db[monthKey];
    }

    function saveData() {
        try {
            localStorage.setItem('health_visits_master_v11', JSON.stringify(db));
        } catch(e) {}
        render();
    }

    function switchMonth(newMonth) {
        activeMonth = newMonth;
        let monthData = getOrCreateMonth(activeMonth);
        const streetKeys = Object.keys(monthData.ruas);
        activeStreet = streetKeys.length > 0 ? streetKeys[0] : null;
        render();
    }

    function addStreet() {
        const input = document.getElementById('streetNameInput');
        if (!input) return;
        const name = input.value.trim();
        if (!name) return;

        let monthData = getOrCreateMonth(activeMonth);
        if (!monthData.ruas[name]) {
            monthData.ruas[name] = { houses: {}, history: [] };
        }
        activeStreet = name;
        input.value = '';
        saveData();
    }

    function deleteCurrentStreet() {
        if (!activeStreet) return;
        if (confirm(`Deseja realmente excluir a rua "${activeStreet}" neste mês?`)) {
            let monthData = getOrCreateMonth(activeMonth);
            delete monthData.ruas[activeStreet];
            const remaining = Object.keys(monthData.ruas);
            activeStreet = remaining.length > 0 ? remaining[0] : null;
            saveData();
        }
    }

    function switchStreet(name) {
        activeStreet = name;
        render();
    }

    function addHouses() {
        if (!activeStreet) return;
        const input = document.getElementById('houseNumberInput');
        if (!input) return;
        const val = input.value.trim();
        if (!val) return;

        const numbers = val.split(',').map(n => n.trim()).filter(n => n !== '');
        let monthData = getOrCreateMonth(activeMonth);
        
        numbers.forEach(num => {
            if (!(num in monthData.ruas[activeStreet].houses)) {
                monthData.ruas[activeStreet].houses[num] = { status: 0, date: null };
            }
        });

        input.value = '';
        saveData();
    }

    function cycleHouseStatus(num, event) {
        if (event && event.target && (event.target.classList.contains('delete-house') || event.target.closest('.delete-house'))) return;
        if (!activeStreet) return;

        let monthData = getOrCreateMonth(activeMonth);
        let house = monthData.ruas[activeStreet].houses[num];
        if (!house) return;
        
        let nextStatus = (house.status + 1) % 3; 
        
        let nowObj = new Date();
        let year = nowObj.getFullYear();
        let month = String(nowObj.getMonth() + 1).padStart(2, '0');
        let day = String(nowObj.getDate()).padStart(2, '0');
        let dateStr = `${day}/${month}/${year}`;

        house.status = nextStatus;
        house.date = (nextStatus !== 0) ? (house.date || dateStr) : null;

        let statusText = 'Pendente';
        let tagClass = 'tag-pending';
        if (nextStatus === 1) { statusText = 'Visitada'; tagClass = 'tag-visited'; }
        if (nextStatus === 2) { statusText = 'Ausente'; tagClass = 'tag-absent'; }

        if (!monthData.ruas[activeStreet].history) {
            monthData.ruas[activeStreet].history = [];
        }

        let history = monthData.ruas[activeStreet].history;
        let existingIndex = history.findIndex(item => item.house === num);

        if (nextStatus === 0) {
            if (existingIndex !== -1) {
                history.splice(existingIndex, 1);
            }
        } else {
            if (existingIndex !== -1) {
                history[existingIndex].statusText = statusText;
                history[existingIndex].tagClass = tagClass;
            } else {
                history.unshift({
                    house: num,
                    statusText: statusText,
                    tagClass: tagClass,
                    date: house.date
                });
            }
        }

        saveData();
    }

    function updateHistoryDate(houseNum, newDate) {
        if (!activeStreet) return;
        
        let monthData = getOrCreateMonth(activeMonth);
        let streetData = monthData.ruas[activeStreet];
        if (!streetData) return;

        let formattedDate = newDate;
        if (newDate && newDate.includes('-')) {
            let parts = newDate.split('-');
            if (parts.length === 3) {
                formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
        }

        if (streetData.history) {
            let histItem = streetData.history.find(item => item.house === houseNum);
            if (histItem) {
                histItem.date = formattedDate;
            }
        }

        if (streetData.houses && streetData.houses[houseNum]) {
            streetData.houses[houseNum].date = formattedDate;
        }

        saveData();
    }

    function deleteHouse(num, event) {
        if (event) event.stopPropagation();
        if (!activeStreet) return;
        if (confirm(`Remover a casa ${num}?`)) {
            let monthData = getOrCreateMonth(activeMonth);
            if (monthData.ruas[activeStreet].houses) {
                delete monthData.ruas[activeStreet].houses[num];
            }
            if (monthData.ruas[activeStreet].history) {
                monthData.ruas[activeStreet].history = monthData.ruas[activeStreet].history.filter(item => item.house !== num);
            }
            saveData();
        }
    }

    function openReport() {
        if (!activeStreet) return;
        let monthData = getOrCreateMonth(activeMonth);
        const streetData = monthData.ruas[activeStreet];
        const modal = document.getElementById('reportModal');
        const pdfStreetName = document.getElementById('pdfStreetName');
        const pdfMonthSubtitle = document.getElementById('pdfMonthSubtitle');
        const visitedGrid = document.getElementById('reportVisitedGrid');
        const absentGrid = document.getElementById('reportAbsentGrid');
        const pendingGrid = document.getElementById('reportPendingGrid');
        
        if (!modal) return;

        pdfStreetName.innerText = `Rua: ${activeStreet}`;
        pdfMonthSubtitle.innerText = `Referência: ${formatMonthName(activeMonth)}`;

        let visited = [];
        let absent = [];
        let pending = [];

        if (streetData.houses) {
            Object.keys(streetData.houses).forEach(num => {
                let h = streetData.houses[num];
                if (h.status === 1) visited.push({ num, date: h.date || 'S/ Data' });
                else if (h.status === 2) absent.push({ num, date: h.date || 'S/ Data' });
                else pending.push(num);
            });
        }

        visitedGrid.innerHTML = visited.length === 0 ? '<div style="font-size:0.75rem; color:#64748b;">Nenhuma</div>' : '';
        visited.forEach(v => {
            let box = document.createElement('div');
            box.className = 'report-box box-visited';
            box.innerHTML = `<span>${v.num}</span><span class="report-box-date">${v.date}</span>`;
            visitedGrid.appendChild(box);
        });

        absentGrid.innerHTML = absent.length === 0 ? '<div style="font-size:0.75rem; color:#64748b;">Nenhuma</div>' : '';
        absent.forEach(a => {
            let box = document.createElement('div');
            box.className = 'report-box box-absent';
            box.innerHTML = `<span>${a.num}</span><span class="report-box-date">${a.date}</span>`;
            absentGrid.appendChild(box);
        });

        pendingGrid.innerHTML = pending.length === 0 ? '<div style="font-size:0.75rem; color:#16a34a; font-weight:bold;">Todas visitadas!</div>' : '';
        pending.forEach(p => {
            let box = document.createElement('div');
            box.className = 'report-box box-pending';
            box.innerHTML = `<span>${p}</span><span class="report-box-date">Pendente</span>`;
            pendingGrid.appendChild(box);
        });

        modal.style.display = 'flex';
    }

    function closeReport() {
        const modal = document.getElementById('reportModal');
        if (modal) modal.style.display = 'none';
    }

    function downloadPDF() {
        const element = document.getElementById('pdfArea');
        const opt = {
            margin:       10,
            filename:     `relatorio_${activeStreet.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_')}_${activeMonth}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().from(element).set(opt).save();
    }

    function formatMonthName(yearMonthStr) {
        const parts = yearMonthStr.split('-');
        if (parts.length !== 2) return yearMonthStr;
        const year = parts[0];
        const monthNum = parseInt(parts[1], 10);
        const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        return `${months[monthNum - 1]} de ${year}`;
    }

    function render() {
        const monthSelect = document.getElementById('monthSelect');
        const streetSelect = document.getElementById('streetSelect');
        const housesGrid = document.getElementById('housesGrid');
        const streetContent = document.getElementById('streetContent');
        const currentStreetTitle = document.getElementById('currentStreetTitle');
        const historyList = document.getElementById('historyList');

        if (!monthSelect || !streetSelect || !housesGrid || !streetContent || !currentStreetTitle || !historyList) return;

        let allMonths = Object.keys(db);
        if (!allMonths.includes(currentYearMonth)) {
            allMonths.push(currentYearMonth);
        }
        allMonths.sort().reverse();

        monthSelect.innerHTML = '';
        allMonths.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.innerText = formatMonthName(m);
            if (m === activeMonth) opt.selected = true;
            monthSelect.appendChild(opt);
        });

        let monthData = getOrCreateMonth(activeMonth);
        const streets = Object.keys(monthData.ruas);

        if (streets.length === 0) {
            streetContent.style.display = 'none';
            streetSelect.innerHTML = '<option value="">Nenhuma rua cadastrada</option>';
            return;
        }

        streetContent.style.display = 'block';

        if (!activeStreet || !monthData.ruas[activeStreet]) {
            activeStreet = streets[0];
        }

        streetSelect.innerHTML = '';
        streets.forEach(street => {
            const opt = document.createElement('option');
            opt.value = street;
            opt.innerText = street;
            if (street === activeStreet) opt.selected = true;
            streetSelect.appendChild(opt);
        });

        currentStreetTitle.innerText = activeStreet;

        housesGrid.innerHTML = '';
        const streetData = monthData.ruas[activeStreet];
        const houseKeys = streetData && streetData.houses ? Object.keys(streetData.houses) : [];

        if (houseKeys.length === 0) {
            housesGrid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">Nenhuma casa cadastrada nesta rua. Digite os números acima.</div>';
        } else {
            houseKeys.forEach(num => {
                const house = streetData.houses[num];
                const div = document.createElement('div');
                
                let statusClass = '';
                if (house && house.status === 1) statusClass = 'visited';
                if (house && house.status === 2) statusClass = 'absent';

                div.className = `house-box ${statusClass}`;
                div.innerHTML = `
                    <span>${num}</span>
                    <button type="button" class="delete-house" onclick="deleteHouse('${num}', event)" title="Excluir casa">×</button>
                `;
                div.onclick = (e) => cycleHouseStatus(num, e);
                housesGrid.appendChild(div);
            });
        }

        historyList.innerHTML = '';
        if (!streetData.history || streetData.history.length === 0) {
            historyList.innerHTML = '<div style="color: #94a3b8; text-align: center; padding: 8px;">Nenhuma ação registrada neste mês.</div>';
        } else {
            streetData.history.forEach((item) => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                
                let dateVal = '';
                if (item.date && item.date.includes('/')) {
                    let parts = item.date.split('/');
                    if (parts.length === 3) {
                        dateVal = `${parts[2]}-${parts[1]}-${parts[0]}`;
                    }
                }

                historyItem.innerHTML = `
                    <span>Casa <strong>${item.house}</strong> marcada como <span class="history-tag ${item.tagClass}">${item.statusText}</span></span>
                    <input type="date" class="date-input" value="${dateVal}" onchange="updateHistoryDate('${item.house}', this.value)">
                `;
                historyList.appendChild(historyItem);
            });
        }
    }

    window.onload = function() {
        getOrCreateMonth(activeMonth);
        render();
    };
</script>

</body>
</html>
